name: Build hyper-v-fd.dll

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout bareos/bareos (shallow + tags)
        uses: actions/checkout@v4
        with:
          repository: bareos/bareos
          ref: master
          fetch-depth: 1
          fetch-tags: true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\buildtrees
          key: vcpkg-bareos-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bareos-x64-

      - name: Reemplazar vcpkg.json (sin Qt ni Postgres)
        shell: pwsh
        run: |
          $j = [ordered]@{
            name = 'hyperv-plugin-build'
            dependencies = @(
              [ordered]@{ name='openssl'; 'default-features'=$false; features=@('tools') },
              'lzo','zlib','jansson','pthread','utfcpp','xxhash',
              'tl-expected','ms-gsl','cli11','pcre2','fmt','jansson'
            )
            overrides = @([ordered]@{ name='cli11'; 'version-string'='2.4.2' })
            'builtin-baseline' = 'ec20452cd73280bac2952cf749d3caec5a237490'
          }
          $j | ConvertTo-Json -Depth 5 | Set-Content vcpkg.json
          Write-Host "vcpkg.json:"; Get-Content vcpkg.json

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows
          Write-Host "OK: vcpkg done"

      - name: Setup MSVC environment (para Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-ninja-${{ hashFiles('core/src/win32/plugins/filed/hyper-v.cc', 'core/src/win32/plugins/filed/CMakeLists.txt') }}
          restore-keys: cmake-ninja-

      - name: Configure CMake (Ninja single-config)
        shell: pwsh
        run: |
          # GIT_DESCRIBE_VERSION activa el bloque de version en BareosExtractVersionInfo.cmake
          # GIT_COMMIT_TIMESTAMP es requerido para las fechas del binario
          $ts = [int][double]::Parse((Get-Date -UFormat %s))
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGIT_DESCRIBE_VERSION=25.0.4 `
            -DGIT_COMMIT_TIMESTAMP=$ts `
            -DENABLE_PYTHON=OFF `
            -DENABLE_BARRI=OFF `
            -DENABLE_TESTING=OFF `
            -DENABLE_GRPC=OFF

      - name: Build hyper-v-fd
        shell: pwsh
        run: |
          cmake --build build --target hyper-v-fd -j $env:NUMBER_OF_PROCESSORS

      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Path build -Filter "hyper-v-fd.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "hyper-v-fd.dll no encontrado"; exit 1 }
          Write-Host "DLL: $($dll.FullName)"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact\

      - name: Upload hyper-v-fd.dll
        uses: actions/upload-artifact@v4
        with:
          name: hyper-v-fd-${{ github.run_number }}
          path: artifact\hyper-v-fd.dll
          if-no-files-found: error
          retention-days: 90
