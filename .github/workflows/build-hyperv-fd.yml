name: Extract hyper-v-fd.dll from official bareos installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  extract:
    runs-on: windows-2022

    steps:
      - name: Download official bareos Windows installer
        shell: pwsh
        run: |
          $url = "https://download.bareos.org/current/windows/Bareos-25.0.4~pre142.0b3da8792-x64-Release.exe"
          Invoke-WebRequest -Uri $url -OutFile bareos-installer.exe -UseBasicParsing
          Write-Host "Downloaded: $((Get-Item bareos-installer.exe).Length) bytes"

      - name: Extract installer with 7-zip
        shell: pwsh
        run: |
          # 7-zip is pre-installed on windows-2022 runners
          & "C:\Program Files\7-Zip\7z.exe" x bareos-installer.exe -oinstaller-contents -y
          Write-Host "Extracted files:"
          Get-ChildItem -Recurse installer-contents | Where-Object { $_.Name -like "*.dll" } | Select-Object FullName

      - name: Find hyper-v-fd.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse installer-contents -Filter "hyper-v-fd.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Host "hyper-v-fd.dll not found in top level, trying nested extraction..."
            # NSIS installers sometimes have a nested archive
            Get-ChildItem installer-contents | Select-Object Name, Length
            exit 1
          }
          Write-Host "FOUND: $($dll.FullName)"
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $dll.FullName artifact\
          Write-Host "Size: $($dll.Length) bytes"

      - name: Upload hyper-v-fd.dll
        uses: actions/upload-artifact@v4
        with:
          name: hyper-v-fd-${{ github.run_number }}
          path: artifact\hyper-v-fd.dll
          if-no-files-found: error
          retention-days: 90
