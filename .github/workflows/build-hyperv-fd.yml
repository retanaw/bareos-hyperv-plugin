name: Build hyper-v-fd.dll

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout bareos/bareos (shallow)
        uses: actions/checkout@v4
        with:
          repository: bareos/bareos
          ref: master
          fetch-depth: 1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\buildtrees
          key: vcpkg-bareos-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bareos-x64-

      - name: Reemplazar vcpkg.json con deps minimas
        shell: pwsh
        run: |
          $content = '{"name":"hyperv-plugin-build","dependencies":["jansson","openssl","zlib","lzo"]}'
          Set-Content -Path vcpkg.json -Value $content
          Write-Host "vcpkg.json:" ; Get-Content vcpkg.json

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows
          Write-Host "OK: vcpkg done"

      - name: Setup MSVC environment (para Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-ninja-${{ hashFiles('core/src/win32/plugins/filed/hyper-v.cc', 'core/src/win32/plugins/filed/CMakeLists.txt') }}
          restore-keys: cmake-ninja-

      - name: Configure CMake (Ninja single-config)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_PYTHON=OFF `
            -DENABLE_BARRI=OFF `
            -DENABLE_TESTING=OFF `
            -DENABLE_GRPC=OFF

      - name: Build hyper-v-fd
        shell: pwsh
        run: |
          cmake --build build --target hyper-v-fd -j $env:NUMBER_OF_PROCESSORS

      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Path build -Filter "hyper-v-fd.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "hyper-v-fd.dll no encontrado"; exit 1 }
          Write-Host "DLL: $($dll.FullName)"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact\

      - name: Upload hyper-v-fd.dll
        uses: actions/upload-artifact@v4
        with:
          name: hyper-v-fd-${{ github.run_number }}
          path: artifact\hyper-v-fd.dll
          if-no-files-found: error
          retention-days: 90
