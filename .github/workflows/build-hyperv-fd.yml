name: Build hyper-v-fd.dll

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout this repo (standalone CMakeLists.txt)
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: Checkout bareos/bareos (headers + source)
        uses: actions/checkout@v4
        with:
          repository: bareos/bareos
          ref: master
          fetch-depth: 1
          path: bareos-src

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Run bareos cmake configure just to generate config.h and version headers.
      # It will fail (bareos_add_plugin not defined on Windows) — that's expected.
      # We only need the generated headers, not a successful configure.
      - name: Generate bareos config.h (partial configure, failure expected)
        shell: pwsh
        run: |
          $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          cmake -B bareos-build -S bareos-src -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DGIT_DESCRIBE_VERSION=25.0.4" `
            "-DGIT_COMMIT_TIMESTAMP=$ts" `
            "-DENABLE_PYTHON=OFF" `
            "-DENABLE_BARRI=OFF" `
            "-DENABLE_TESTING=OFF" `
            "-DENABLE_GRPC=OFF"
          # cmake exits non-zero but config.h is already generated — ignore exit code
          exit 0

      - name: Verify config.h was generated
        shell: pwsh
        run: |
          $h = "bareos-build\include\config.h"
          if (-not (Test-Path $h)) { Write-Error "config.h not generated"; exit 1 }
          Write-Host "config.h OK"
          Get-Content $h | Select-Object -First 10

      - name: Configure our standalone build
        shell: pwsh
        run: |
          cmake -B build -S plugin-repo -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DBAREOS_SRC=${{ github.workspace }}\bareos-src" `
            "-DBAREOS_BUILD=${{ github.workspace }}\bareos-build"

      - name: Build hyper-v-fd.dll
        shell: pwsh
        run: cmake --build build --target hyper-v-fd -j $env:NUMBER_OF_PROCESSORS

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter hyper-v-fd.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "hyper-v-fd.dll not found"; exit 1 }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $dll.FullName artifact\
          Write-Host "OK: $($dll.FullName)"

      - name: Upload hyper-v-fd.dll
        uses: actions/upload-artifact@v4
        with:
          name: hyper-v-fd-${{ github.run_number }}
          path: artifact\hyper-v-fd.dll
          if-no-files-found: error
          retention-days: 90
