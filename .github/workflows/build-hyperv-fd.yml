name: Build hyper-v-fd.dll

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout bareos/bareos
        uses: actions/checkout@v4
        with:
          repository: bareos/bareos
          ref: master
          fetch-depth: 1

      # Cache vcpkg — primera corrida ~45min, siguientes ~2min
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-bareos-${{ hashFiles('vcpkg.json') }}-x64
          restore-keys: vcpkg-bareos-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows
          Write-Host "vcpkg OK"

      - name: Setup MSVC (Ninja requiere env de VS)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Cache del build — si los sources no cambian, reutiliza objetos compilados
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ hashFiles('core/src/win32/plugins/filed/hyper-v.cc') }}
          restore-keys: cmake-

      - name: Configure CMake
        shell: pwsh
        run: |
          $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          cmake -B build -S . `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DGIT_DESCRIBE_VERSION=25.0.4" `
            "-DGIT_COMMIT_TIMESTAMP=$ts" `
            "-DENABLE_PYTHON=OFF" `
            "-DENABLE_BARRI=OFF" `
            "-DENABLE_TESTING=OFF" `
            "-DENABLE_GRPC=OFF"

      - name: Build hyper-v-fd.dll
        shell: pwsh
        run: cmake --build build --target hyper-v-fd -j $env:NUMBER_OF_PROCESSORS

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter hyper-v-fd.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "hyper-v-fd.dll not found"; exit 1 }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $dll.FullName artifact\
          Write-Host "OK: $($dll.FullName)"

      - name: Upload hyper-v-fd.dll
        uses: actions/upload-artifact@v4
        with:
          name: hyper-v-fd-${{ github.run_number }}
          path: artifact\hyper-v-fd.dll
          if-no-files-found: error
          retention-days: 90
