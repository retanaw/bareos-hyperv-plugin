name: Build hyper-v-fd.dll

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout this repo (standalone CMakeLists.txt)
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: Checkout bareos/bareos (headers + hyper-v.cc)
        uses: actions/checkout@v4
        with:
          repository: bareos/bareos
          ref: master
          fetch-depth: 1
          path: bareos-src

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (standalone, no bareos build system)
        shell: pwsh
        run: |
          cmake -B build -S plugin-repo `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DBAREOS_SRC=${{ github.workspace }}/bareos-src"

      - name: Build hyper-v-fd.dll
        shell: pwsh
        run: cmake --build build --target hyper-v-fd -j $env:NUMBER_OF_PROCESSORS

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter hyper-v-fd.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "hyper-v-fd.dll not found"; exit 1 }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $dll.FullName artifact\
          Write-Host "OK: $($dll.FullName)"

      - name: Upload hyper-v-fd.dll
        uses: actions/upload-artifact@v4
        with:
          name: hyper-v-fd-${{ github.run_number }}
          path: artifact\hyper-v-fd.dll
          if-no-files-found: error
          retention-days: 90
